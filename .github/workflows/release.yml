name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:extension
      - name: Package extensions
        run: |
          (cd build/chromium && zip -r "../../browser-starter-chromium-${GITHUB_REF_NAME}.zip" .)
          (cd build/firefox && zip -r "../../browser-starter-firefox-${GITHUB_REF_NAME}.zip" .)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: browser-starter-*.zip